name: CI

# Pruebas de integridad del catalogo, aplicabilidad, multas, riesgo residual y API en cada PR.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:coverage
      - run: npm run lint
      - run: npx tsc -p tsconfig.worker.json
      - run: npm run build
